<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — TRYCON BUILT CARE</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
      <h1 class="text-2xl font-bold mb-2 text-gray-800">Sign In</h1>
      <p class="text-gray-600 mb-6 text-sm">Wireframe — wire this to <code>supabase.auth.signInWithPassword</code></p>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email</label>
          <input id="email" type="email" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
          <input id="password" type="password" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition-colors">
          Sign In
        </button>
      </form>

      <p class="mt-4 text-center text-sm text-gray-600">
        <a href="/index.html" class="text-blue-600 hover:underline">Back to Dashboard</a>
      </p>
    </div>

    <script type="module">
      import { supabase } from '/src/supabaseClient.js';

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          alert(error.message);
        } else {
          window.location.replace('/index.html');
        }
      });
    </script>
  </body>
</html>
